server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (kept on the miniapp container as well; Caddy in prod is the source of truth).
  # frame-ancestors permits Telegram WebView embedding.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.telegram.org; frame-ancestors https://web.telegram.org https://t.me https://*.telegram.org; base-uri 'self'; form-action 'self'" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy (kept here for parity with dev; in prod the reverse proxy handles this)
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Static asset caching
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
