# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking
      TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking_test
      BOT_TOKEN: ci-bot-token
      JWT_SECRET: ci-jwt-secret-please-rotate
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: latest
          enable-cache: true
      - run: uv sync --all-groups
      - name: Create test database
        run: |
          PGPASSWORD=booking psql -h localhost -U booking -d booking \
            -c "CREATE DATABASE booking_test OWNER booking;"
      - run: uv run alembic upgrade head
      - run: uv run ruff check app/ tests/
      - run: uv run pytest -q

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  smoke:
    needs: [backend, miniapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env.production
        run: |
          cp .env.production.example .env.production
          sed -i 's|^DOMAIN=$|DOMAIN=:80|' .env.production
          sed -i 's|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=ci-pass|' .env.production
          sed -i 's|^JWT_SECRET=$|JWT_SECRET=ci-jwt-secret-32-chars-minimum-len|' .env.production
          sed -i 's|^BOT_TOKEN=$|BOT_TOKEN=ci-bot-token|' .env.production
          sed -i 's|^BOT_MODE=webhook$|BOT_MODE=polling|' .env.production
          sed -i 's|^BOT_WEBHOOK_SECRET_TOKEN=$|BOT_WEBHOOK_SECRET_TOKEN=ci-secret|' .env.production
          sed -i 's|^BOT_WEBHOOK_URL=.*$|BOT_WEBHOOK_URL=|' .env.production
          sed -i 's|^MINI_APP_URL=.*$|MINI_APP_URL=http://localhost|' .env.production
      - name: Boot stack
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
      - name: Wait for api healthy
        run: |
          for i in $(seq 1 60); do
            cid=$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q api)
            if [ -z "$cid" ]; then sleep 2; continue; fi
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
            echo "api health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy. Logs:"
          docker compose -f docker-compose.prod.yml --env-file .env.production logs
          exit 1
      - name: Smoke /health and root
        run: |
          curl -fsSL http://localhost/health
          curl -fsSL -o /dev/null -w "%{http_code}\n" http://localhost/
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v
